<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f1; --ink:#2b2622; --muted:#948b80; --accent:#b5652d;
    --line:#f0ebe3; --border:#d8d0c4; --chip:#e8e2d8;
    --ok:#4c7a52; --bad:#b3453f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Source Serif 4',Georgia,serif;
    padding:40px 24px 80px;
  }
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:34px;font-weight:600;margin:0 0 4px}
  h2{font-size:24px;font-weight:600;margin:0}
  .lead{margin:0;font-size:13px;color:var(--muted)}

  /* toolbar */
  .toolbar{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:16px auto}
  .link{background:none;border:none;padding:0;font:inherit;font-size:12px;
        color:var(--muted);text-decoration:underline;cursor:pointer}
  .link.danger{color:var(--bad)}

  /* resumo */
  .summary{
    position:sticky;top:12px;z-index:5;background:#fff;border-radius:16px;
    padding:18px 20px;box-shadow:0 4px 20px rgba(43,38,34,.1);
    display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-bottom:24px;
  }
  .label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
         color:var(--muted);margin-bottom:3px}
  .total{font-size:28px;font-weight:600;color:var(--accent)}
  .meta{display:flex;align-items:center;gap:3px;font-size:16px}
  .meta input{width:100px;font:inherit;border:none;border-bottom:1px solid var(--border);
              background:transparent;color:inherit}
  .diff{font-size:14px;font-weight:600}
  .diff.ok{color:var(--ok)}
  .diff.bad{color:var(--bad)}

  /* tabela */
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(43,38,34,.06);
        overflow:hidden;margin-bottom:40px}
  .row{padding:14px 20px;border-bottom:1px solid var(--line);
       display:flex;flex-direction:column;gap:10px}
  .row-main{display:flex;gap:16px}
  .row-head{flex:none;width:170px;display:flex;justify-content:space-between;
            align-items:baseline;gap:8px}
  .cat-name{font-size:14px;font-weight:600}
  .cat-sub{font-size:11px;color:var(--muted)}
  .quotes{flex:1;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}

  .quote{cursor:pointer;border:1.5px solid var(--chip);background:#fff;border-radius:8px;
         padding:8px 10px;min-width:140px}
  .quote.sel{border-color:var(--accent);background:rgba(181,101,45,.08)}
  .quote-top{display:flex;justify-content:space-between;gap:6px}
  .supplier{font-size:13px;font-weight:500}
  .price{font-size:12px;color:#6b6259;font-weight:600}
  .notes{font-size:11px;color:var(--muted);margin-top:2px}
  .icon{background:none;border:none;color:#c9c0b4;cursor:pointer;line-height:1;
        padding:1px;font-size:13px;font-family:inherit}
  .icon.pencil{color:#b7ae9f;font-size:12px}
  .quote-actions{display:flex;gap:4px;flex:none}

  .dashed{background:none;border:1px dashed var(--border);border-radius:8px;
          color:var(--muted);cursor:pointer;font:inherit}
  .add-quote{padding:8px 12px;font-size:12px;align-self:stretch}
  .add-cat{padding:9px 14px;font-size:13px;width:100%;text-align:left}

  /* formulários */
  form.inline{border:1px dashed var(--border);border-radius:8px;padding:10px;
              display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  form.chip{padding:8px;flex-direction:column;gap:5px;min-width:140px;align-items:stretch}
  .in{border:1px solid var(--border);border-radius:6px;padding:6px 8px;
      font:inherit;font-size:13px;color:inherit;background:#fff;min-width:0}
  form.chip .in{padding:5px 7px;font-size:12px}
  .in.grow{flex:1;min-width:140px}
  .in.small{width:110px}
  .in:focus{border-color:var(--accent)}
  input:focus{outline:none}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:6px;
       padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
  form.chip .btn{padding:5px 9px;font-size:11px}
  .btn.lg{border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600}
  .btn.sm{border-radius:7px;padding:6px 12px;align-self:flex-start}
  .btn-row{display:flex;gap:6px}
  .footer-total{display:flex;justify-content:space-between;padding:16px 20px;
                background:var(--bg);font-size:15px;font-weight:700}
  .footer-total .v{color:var(--accent)}
  .empty{padding:20px;color:var(--muted);font-size:13px}

  /* combinações */
  .sc-head{display:flex;justify-content:space-between;align-items:baseline;
           flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .sc{background:#fff;border-radius:12px;padding:16px;
      box-shadow:0 2px 10px rgba(43,38,34,.06);display:flex;flex-direction:column;gap:6px}
  .sc-top{display:flex;justify-content:space-between}
  .sc-name{font-size:15px;font-weight:700}
  .sc-total{font-size:20px;font-weight:600;color:var(--accent)}
  .sc-delta{font-size:11px;color:var(--muted)}
  .note{margin-top:32px;font-size:11px;color:var(--muted);text-align:center}

  @media (max-width:640px){
    body{padding:24px 14px 60px}
    h1{font-size:26px}
    .summary{padding:12px 14px;gap:14px}
    .total{font-size:20px}
    .meta{font-size:13px}
    .meta input{width:64px}
    .diff{font-size:12px}
    .row-main{flex-direction:column}
    .row-head{width:100%}
    .quotes .quote,.add-quote,form.chip{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Comparador de Orçamentos</h1>
  <p class="lead">Cada linha é uma categoria, cada célula uma cotação. Escolha uma opção por categoria e compare o total com a sua meta.</p>

  <div class="toolbar">
    <button class="link" data-action="export">Exportar JSON</button>
    <label class="link" style="cursor:pointer">Importar JSON
      <input id="importFile" type="file" accept="application/json" hidden>
    </label>
    <button class="link danger" data-action="reset">Zerar tudo</button>
  </div>

  <div class="summary">
    <div>
      <div class="label">Total</div>
      <div class="total" id="totalLabel">&mdash;</div>
    </div>
    <div>
      <div class="label">Meta</div>
      <div class="meta"><span>R$</span><input id="metaInput" inputmode="decimal" aria-label="Meta de orçamento"></div>
    </div>
    <div>
      <div class="label">Diferença</div>
      <div class="diff" id="diffLabel">&mdash;</div>
    </div>
  </div>

  <div class="card" id="table"></div>

  <div class="sc-head">
    <h2>Combinações salvas</h2>
    <div id="scenarioHead"></div>
  </div>
  <div id="scenarios"></div>

  <p class="note">Os dados ficam salvos apenas neste navegador. Use &ldquo;Exportar JSON&rdquo; para guardar uma cópia.</p>
</div>

<script>
(function(){
"use strict";

var KEY = "orcamento-combinacoes-v1";

/* ---------- estado ---------- */

function normalize(s){
  s = s || {};
  return {
    categories: Array.isArray(s.categories) ? s.categories : [],
    selections: (s.selections && typeof s.selections === "object") ? s.selections : {},
    scenarios: Array.isArray(s.scenarios) ? s.scenarios : [],
    budgetTarget: typeof s.budgetTarget === "number" ? s.budgetTarget : 0
  };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return normalize({});
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

var state = load();
var ui = { addingQuoteFor:null, editing:null, addingCategory:false, savingScenario:false };

function resetUI(){
  ui.addingQuoteFor = null; ui.editing = null;
  ui.addingCategory = false; ui.savingScenario = false;
}

/* ---------- helpers ---------- */

var brl = new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" });
function fmt(v){ return brl.format(v || 0); }

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Aceita "7650", "7.650,50", "11.700" e "7650.50".
   Com vírgula, ela é o decimal e os pontos são milhar.
   Só com pontos, se estiverem todos em grupos de 3 ("11.700", "1.234.567")
   são milhar; caso contrário o ponto é decimal ("11.70"). */
function num(v){
  var s = String(v == null ? "" : v).trim().replace(/\s/g,"").replace(/R\$/gi,"");
  if(!s) return 0;
  if(s.indexOf(",") > -1){
    s = s.replace(/\./g,"").replace(",",".");
  }else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g,"");
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function uid(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
       : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
}

function findCat(id){
  return state.categories.filter(function(c){ return c.id === id; })[0] || null;
}
function findQuote(cat, id){
  if(!cat) return null;
  return cat.quotes.filter(function(q){ return q.id === id; })[0] || null;
}
function totalOf(sel){
  return state.categories.reduce(function(sum, c){
    var q = findQuote(c, sel[c.id]);
    return sum + (q ? q.price : 0);
  }, 0);
}
function deltaLabel(diff){
  return diff >= 0 ? fmt(diff) + " dentro da meta"
                   : fmt(Math.abs(diff)) + " acima da meta";
}

/* ---------- render ---------- */

var elTable  = document.getElementById("table");
var elScHead = document.getElementById("scenarioHead");
var elSc     = document.getElementById("scenarios");
var elTotal  = document.getElementById("totalLabel");
var elDiff   = document.getElementById("diffLabel");
var elMeta   = document.getElementById("metaInput");

function render(){
  renderSummary();
  renderTable();
  renderScenarioHead();
  renderScenarios();
}

function renderSummary(){
  var total = totalOf(state.selections);
  var diff  = state.budgetTarget - total;
  elTotal.textContent = fmt(total);
  elDiff.textContent  = deltaLabel(diff);
  elDiff.className    = "diff " + (diff >= 0 ? "ok" : "bad");
  var foot = document.getElementById("footTotal");
  if(foot) foot.textContent = fmt(total);
}

function quoteHTML(cat, q){
  if(ui.editing && ui.editing.cat === cat.id && ui.editing.quote === q.id){
    return '<form class="inline chip" data-action="edit-quote">'
      + '<input class="in" name="supplier" value="' + esc(q.supplier) + '" placeholder="Fornecedor">'
      + '<input class="in" name="price" inputmode="decimal" value="' + esc(q.price) + '" placeholder="Valor">'
      + '<input class="in" name="notes" value="' + esc(q.notes) + '" placeholder="notas">'
      + '<div class="btn-row">'
        + '<button class="btn" type="submit">Salvar</button>'
        + '<button class="link" type="button" data-action="cancel">cancelar</button>'
      + '</div>'
      + '</form>';
  }
  var selected = state.selections[cat.id] === q.id;
  return '<div class="quote' + (selected ? " sel" : "") + '" data-action="select"'
      + ' data-cat="' + esc(cat.id) + '" data-quote="' + esc(q.id) + '">'
    + '<div class="quote-top">'
      + '<div class="supplier">' + esc(q.supplier) + '</div>'
      + '<div class="quote-actions">'
        + '<button class="icon pencil" title="Editar" data-action="edit" data-cat="' + esc(cat.id) + '" data-quote="' + esc(q.id) + '">&#9998;</button>'
        + '<button class="icon" title="Remover" data-action="del-quote" data-cat="' + esc(cat.id) + '" data-quote="' + esc(q.id) + '">&times;</button>'
      + '</div>'
    + '</div>'
    + '<div class="price">' + fmt(q.price) + '</div>'
    + (q.notes ? '<div class="notes">' + esc(q.notes) + '</div>' : '')
    + '</div>';
}

function categoryHTML(cat){
  var sel = findQuote(cat, state.selections[cat.id]);
  var html = '<div class="row"><div class="row-main">'
    + '<div class="row-head">'
      + '<div>'
        + '<div class="cat-name">' + esc(cat.name) + '</div>'
        + '<div class="cat-sub">' + (sel ? fmt(sel.price) : "Nenhuma escolha") + '</div>'
      + '</div>'
      + '<button class="icon" title="Remover categoria" data-action="del-cat" data-cat="' + esc(cat.id) + '">&times;</button>'
    + '</div>'
    + '<div class="quotes">'
    + cat.quotes.map(function(q){ return quoteHTML(cat, q); }).join("");

  if(ui.addingQuoteFor !== cat.id){
    html += '<button class="dashed add-quote" data-action="open-add-quote" data-cat="' + esc(cat.id) + '">+ cotação</button>';
  }
  html += '</div></div>';

  if(ui.addingQuoteFor === cat.id){
    html += '<form class="inline" data-action="add-quote" data-cat="' + esc(cat.id) + '">'
      + '<input class="in grow" name="supplier" placeholder="Fornecedor">'
      + '<input class="in small" name="price" inputmode="decimal" placeholder="Valor">'
      + '<input class="in grow" name="notes" placeholder="Notas (opcional)">'
      + '<button class="btn" type="submit">Adicionar</button>'
      + '<button class="link" type="button" data-action="cancel">cancelar</button>'
      + '</form>';
  }
  return html + '</div>';
}

function renderTable(){
  var html = state.categories.length
    ? state.categories.map(categoryHTML).join("")
    : '<div class="empty">Nenhuma categoria ainda. Crie uma abaixo, '
      + 'ou use <b>Importar JSON</b> l&aacute; em cima para trazer seus dados.</div>';

  html += '<div class="row" style="border-bottom:none">';
  if(ui.addingCategory){
    html += '<form class="inline" data-action="add-cat" style="border:none;padding:0">'
      + '<input class="in grow" name="name" placeholder="Nome da categoria">'
      + '<button class="btn" type="submit">Adicionar</button>'
      + '<button class="link" type="button" data-action="cancel">cancelar</button>'
      + '</form>';
  }else{
    html += '<button class="dashed add-cat" data-action="open-add-cat">+ nova categoria</button>';
  }
  html += '</div>';

  html += '<div class="footer-total"><span>TOTAL</span>'
        + '<span class="v" id="footTotal">' + fmt(totalOf(state.selections)) + '</span></div>';

  elTable.innerHTML = html;
}

function renderScenarioHead(){
  elScHead.innerHTML = ui.savingScenario
    ? '<form class="inline" data-action="save-scenario" style="border:none;padding:0">'
        + '<input class="in" name="name" placeholder="Nome">'
        + '<button class="btn" type="submit">Salvar</button>'
        + '<button class="link" type="button" data-action="cancel">cancelar</button>'
      + '</form>'
    : '<button class="btn lg" data-action="open-save-scenario">Salvar combinação atual</button>';
}

function renderScenarios(){
  if(!state.scenarios.length){
    elSc.innerHTML = '<p class="lead">Nenhuma combinação salva ainda.</p>';
    return;
  }
  elSc.innerHTML = '<div class="sc-grid">' + state.scenarios.map(function(sc){
    var total = totalOf(sc.selections || {});
    return '<div class="sc">'
      + '<div class="sc-top">'
        + '<span class="sc-name">' + esc(sc.name) + '</span>'
        + '<button class="icon" title="Remover" data-action="del-scenario" data-id="' + esc(sc.id) + '">&times;</button>'
      + '</div>'
      + '<div class="sc-total">' + fmt(total) + '</div>'
      + '<div class="sc-delta">' + deltaLabel(state.budgetTarget - total) + '</div>'
      + '<button class="btn sm" data-action="load-scenario" data-id="' + esc(sc.id) + '">Carregar</button>'
      + '</div>';
  }).join("") + '</div>';
}

function focusForm(){
  var el = document.querySelector("form[data-action] .in");
  if(el) el.focus();
}

/* ---------- cliques ---------- */

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el || el.tagName === "FORM") return;

  var a = el.dataset.action;
  var catId = el.dataset.cat, quoteId = el.dataset.quote, id = el.dataset.id;

  if(a === "select"){
    state.selections[catId] = (state.selections[catId] === quoteId) ? "" : quoteId;
    persist(); renderSummary(); renderTable(); renderScenarios();

  }else if(a === "edit"){
    resetUI(); ui.editing = { cat:catId, quote:quoteId };
    renderTable(); focusForm();

  }else if(a === "del-quote"){
    var cat = findCat(catId);
    if(cat) cat.quotes = cat.quotes.filter(function(q){ return q.id !== quoteId; });
    if(state.selections[catId] === quoteId) state.selections[catId] = "";
    resetUI(); persist(); render();

  }else if(a === "open-add-quote"){
    resetUI(); ui.addingQuoteFor = catId;
    renderTable(); focusForm();

  }else if(a === "del-cat"){
    var c = findCat(catId);
    if(!c || !confirm('Remover a categoria "' + c.name + '" e todas as suas cotações?')) return;
    state.categories = state.categories.filter(function(x){ return x.id !== catId; });
    delete state.selections[catId];
    resetUI(); persist(); render();

  }else if(a === "open-add-cat"){
    resetUI(); ui.addingCategory = true;
    renderTable(); focusForm();

  }else if(a === "open-save-scenario"){
    resetUI(); ui.savingScenario = true;
    renderScenarioHead(); focusForm();

  }else if(a === "load-scenario"){
    var sc = state.scenarios.filter(function(x){ return x.id === id; })[0];
    if(!sc) return;
    state.selections = Object.assign({}, sc.selections);
    resetUI(); persist(); render();

  }else if(a === "del-scenario"){
    state.scenarios = state.scenarios.filter(function(x){ return x.id !== id; });
    persist(); renderScenarios();

  }else if(a === "cancel"){
    resetUI(); render();

  }else if(a === "export"){
    exportJSON();

  }else if(a === "reset"){
    if(!confirm("Zerar tudo? Isso remove categorias, cotações e combinações salvas.")) return;
    state = normalize({}); resetUI(); persist();
    elMeta.value = state.budgetTarget;
    render();
  }
});

/* ---------- formulários (Enter também funciona) ---------- */

document.addEventListener("submit", function(e){
  var f = e.target.closest("form[data-action]");
  if(!f) return;
  e.preventDefault();

  var val = function(n){ return f.elements[n] ? f.elements[n].value.trim() : ""; };
  var a = f.dataset.action;

  if(a === "add-quote"){
    var cat = findCat(f.dataset.cat);
    if(!cat || !val("supplier")) return;
    cat.quotes.push({ id:uid(), supplier:val("supplier"), price:num(val("price")), notes:val("notes") });

  }else if(a === "edit-quote"){
    if(!ui.editing) return;
    var q = findQuote(findCat(ui.editing.cat), ui.editing.quote);
    if(!q) return;
    q.supplier = val("supplier") || q.supplier;
    q.price    = num(val("price"));
    q.notes    = val("notes");

  }else if(a === "add-cat"){
    if(!val("name")) return;
    var nid = uid();
    state.categories.push({ id:nid, name:val("name"), quotes:[] });
    state.selections[nid] = "";

  }else if(a === "save-scenario"){
    if(!val("name")) return;
    state.scenarios.push({
      id: uid(),
      name: val("name"),
      selections: Object.assign({}, state.selections),
      createdAt: Date.now()
    });
  }

  resetUI(); persist(); render();
});

elMeta.addEventListener("input", function(){
  state.budgetTarget = num(elMeta.value);
  persist(); renderSummary(); renderScenarios();
});

/* ---------- exportar / importar ---------- */

function exportJSON(){
  var data = Object.assign({ version:1, exportedAt:new Date().toISOString() }, state);
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href = url;
  a.download = "orcamento.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("importFile").addEventListener("change", function(e){
  var file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      state = normalize(JSON.parse(reader.result));
      resetUI(); persist();
      elMeta.value = state.budgetTarget;
      render();
    }catch(err){
      alert("Arquivo inválido.");
    }
  };
  reader.readAsText(file);
});

/* ---------- início ---------- */

elMeta.value = state.budgetTarget;
render();

})();
</script>
</body>
</html>
